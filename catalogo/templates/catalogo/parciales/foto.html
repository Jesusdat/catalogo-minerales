{% load gm %}{% if m.tiene_foto %}<img src="{{ m.foto_url }}" alt="Ejemplar de {{ m.nombre|lower }}" loading="{{ carga|default:'lazy' }}" decoding="async" width="{{ m.foto.ancho }}" height="{{ m.foto.alto }}" class="object-cover {{ clase }}">{% else %}<div role="img" aria-label="{{ m.nombre }}" class="flex items-center justify-center {{ clase }}" style="background:linear-gradient(135deg, {{ m.color_hex }}55, {{ m.color_hex }}22)">{% icono "gem" "h-10 w-10 text-muted" %}</div>{% endif %}
